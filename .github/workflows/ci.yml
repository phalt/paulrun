name: CI - Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15-dev"]
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}
      #----------------------------------------------
      #  -----  install & configure uv  -----
      #----------------------------------------------
      # Pointing uv at the interpreter setup-python installed overrides .python-version,
      # which would otherwise make every matrix entry run on 3.14.
      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ steps.setup-python.outputs.python-path }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      #----------------------------------------------
      # install dependencies
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --frozen
      - name: Show Python version
        run: uv run python --version
      #----------------------------------------------
      # Run linting and tests
      #----------------------------------------------
      - name: Ruff format check
        run: |
          uv run ruff format --check .
      - name: Ruff linting
        run: |
          uv run ruff check .
      - name: Type check with ty
        run: |
          uv run ty check
      - name: Test with pytest
        run: |
          uv run pytest -vv --cov=paulrun --cov-branch --cov-report=term-missing --cov-config=pyproject.toml
