site_name: rundot
site_url: https://docs.rundot.dev/
theme:
  name: material
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  font:
    text: Geist
    code: Geist Mono
  features:
    - navigation.tabs
    - content.code.copy
    - search.suggest
    - search.highlight
    - navigation.footer
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - stylesheets/extra.css
repo_name: phalt/rundot
repo_url: https://github.com/phalt/rundot
nav:
  - 🏃‍♂️‍➡️📕 Home: index.md
  - 🚀 Install: install.md
  - 📝 Documentation:
    - 📜 Runbook format: runbook-format.md
    - 📟 Command line: cli.md
    - 📚 Your runbook library: library.md
    - 🔌 Backends: backends.md
  - 🗒️ Change Log: CHANGELOG.md

markdown_extensions:
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - codehilite
