[project]
name = "paulrun"
version = "0.1.0"
description = "Run hand-written markdown runbooks"
authors = [{ name = "Paul Hallett", email = "paulandrewhallett@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "markdown-it-py>=4.2.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/phalt/paulrun"
Documentation = "https://phalt.github.io/paulrun/"
Issues = "https://github.com/phalt/paulrun/issues"

[project.scripts]
paulrun = "paulrun.cli:cli"

# Built-in backends are registered here, the same way external backends register theirs.
[project.entry-points."paulrun.backends"]
shell = "paulrun.backends.shell:ShellBackend"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paulrun"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
